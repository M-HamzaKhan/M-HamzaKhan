<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B1220">
        <animate attributeName="stop-color" values="#0B1220;#10203A;#0B1220" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.45"/>
    </pattern>
    <clipPath id="revealTitle">
      <rect x="0" y="0" width="0" height="70">
        <animate attributeName="width" from="0" to="640" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" values="0;640"/>
      </rect>
    </clipPath>
    <clipPath id="revealSubtitle">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" from="0" to="720" dur="1.4s" begin="1.9s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" values="0;720"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <ellipse cx="600" cy="130" rx="500" ry="180" fill="url(#glowGrad)">
    <animateTransform attributeName="transform" type="translate" values="-40 0; 40 0; -40 0" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- circuit lines -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.4" opacity="0.5">
    <path d="M 0 40 L 160 40 L 200 80 L 400 80">
      <animate attributeName="stroke-dasharray" values="0 900" dur="0.01s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" to="6 12" dur="0.01s" begin="0s" fill="freeze"/>
    </path>
    <path d="M 1200 220 L 1020 220 L 980 180 L 780 180">
      <animate attributeName="stroke-dasharray" to="6 12" dur="0.01s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 230 L 120 230 L 150 210 L 260 210">
      <animate attributeName="stroke-dasharray" to="4 10" dur="0.01s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 1200 30 L 1080 30 L 1050 55 L 940 55">
      <animate attributeName="stroke-dasharray" to="4 10" dur="0.01s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="3.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pulsing nodes -->
  <g fill="#67E8F9">
    <circle cx="200" cy="80" r="3">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;4;2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="180" r="3">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="r" values="2;4;2" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="150" cy="210" r="2.5">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.1s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="1050" cy="55" r="2.5">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="400" cy="80" r="2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="780" cy="180" r="2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
  </g>

  <!-- title -->
  <g clip-path="url(#revealTitle)">
    <text x="60" y="118" font-size="42" font-weight="700" letter-spacing="2" fill="#E0F2FE">MUHAMMAD HAMZA KHAN</text>
  </g>
  <rect x="614" y="82" width="4" height="40" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <g clip-path="url(#revealSubtitle)">
    <text x="60" y="160" font-size="18" letter-spacing="1" fill="#67E8F9">AI / ML ENGINEER — COMPUTER VISION &amp; DEEP LEARNING</text>
  </g>

  <!-- status line -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.4s" fill="freeze"/>
    <circle cx="62" cy="196" r="4" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="200" font-size="13" fill="#94A3B8">system.status: ONLINE — building production AI pipelines</text>
  </g>

  <!-- bottom scan line -->
  <rect x="-300" y="257" width="300" height="2" fill="url(#scanGrad)">
    <animate attributeName="x" from="-300" to="1200" dur="3.4s" repeatCount="indefinite"/>
  </rect>
</svg>

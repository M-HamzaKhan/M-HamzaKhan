<svg viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <clipPath id="revealFooter">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" from="0" to="640" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" values="0;640"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="1200" height="100" fill="url(#fbgGrad)"/>
  <rect width="1200" height="1" y="0" fill="#1E3A8A" opacity="0.6"/>

  <g transform="translate(300,0)">
    <circle cx="0" cy="50" r="5" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g clip-path="url(#revealFooter)">
      <text x="18" y="56" font-size="17" letter-spacing="1" fill="#67E8F9">STATUS: OPEN TO AI / ML COLLABORATION</text>
    </g>
  </g>
</svg>
